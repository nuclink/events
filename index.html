<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>核物理会议信息</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
}

.header {
  background: #1f2d3d;
  color: white;
  padding: 18px 40px;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  background: white;
  padding: 30px 40px;
  border-radius: 10px;
}

h1 {
  font-size: 34px;
  border-left: 6px solid #2c7be5;
  padding-left: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

#map {
  width: 100%;
  height: 520px;
  margin-top: 40px;
}
</style>
</head>

<body>

<div class="header">Nuclear Physics Conferences</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <table id="conferenceTable"></table>

  <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>

<script>
let conferenceData = [];

const geoCoordMap = {
  "北京": [116.4, 39.9],
  "上海": [121.47, 31.23],
  "南京": [118.79, 32.06],
  "广州": [113.26, 23.13],
  "西安": [108.94, 34.34],
  "武汉": [114.30, 30.59],
  "成都": [104.06, 30.57]
};

function getLatest(data, n = 10) {
  return [...data]
    .sort((a, b) => new Date(a.start_date) - new Date(b.start_date))
    .slice(0, n);
}

function renderTable(data) {
  const table = document.getElementById("conferenceTable");

  table.innerHTML = `
    <tr>
      <th>会议名称</th>
      <th>地点</th>
      <th>时间</th>
    </tr>
  `;

  data.forEach(c => {
    table.innerHTML += `
      <tr>
        <td>${c.title}</td>
        <td>${c.location}</td>
        <td>${c.start_date} — ${c.end_date}</td>
      </tr>
    `;
  });
}

function initMap(data) {
  const chart = echarts.init(document.getElementById("map"));

  const latest = getLatest(data, 10);

  let lines = [];
  let labels = [];

  const rightX = 135; // 标签统一放右边（核心优化）
  const startY = 55;
  const stepY = 5;

  latest.forEach((c, i) => {
    const coord = geoCoordMap[c.location];
    if (!coord) return;

    // 右侧标签（严格纵向排布）
    const labelCoord = [rightX, startY - i * stepY];

    // 线：城市 → 标签
    lines.push({
      coords: [coord, labelCoord]
    });

    // 标签内容（重点）
    labels.push({
      name: c.title,
      value: labelCoord.concat(
        `${c.title}\n${c.location}\n${c.start_date} — ${c.end_date}`
      )
    });
  });

  chart.setOption({
    geo: {
      map: "china",
      roam: true,
      itemStyle: {
        areaColor: "#e6f0ff",
        borderColor: "#999"
      }
    },

    series: [

      // 城市点
      {
        type: "scatter",
        coordinateSystem: "geo",
        data: latest.map(c => {
          const coord = geoCoordMap[c.location];
          return coord ? { name: c.title, value: coord } : null;
        }).filter(Boolean),
        symbolSize: 8
      },

      // 连线（关键优化：完全不会乱跑）
      {
        type: "lines",
        coordinateSystem: "geo",
        effect: {
          show: true,
          symbol: "arrow",
          symbolSize: 6
        },
        lineStyle: {
          width: 1.5,
          curveness: 0.1,
          color: "#555"
        },
        data: lines
      },

      // 标签（核心）
      {
        type: "scatter",
        coordinateSystem: "geo",
        data: labels,
        symbol: "none",
        label: {
          show: true,
          formatter: p => {
            const val = p.data.value[2];
            return `{title|${p.data.name}}\n{text|${val.split("\n")[2]}}`;
          },
          rich: {
            title: {
              fontWeight: "bold",
              fontSize: 13,
              color: "#111"
            },
            text: {
              fontSize: 12,
              color: "#333"
            }
          },
          backgroundColor: "rgba(255,255,255,0.9)",
          borderRadius: 6,
          padding: [6, 8],
          borderColor: "#ccc",
          borderWidth: 1
        }
      }

    ]
  });
}

fetch("conferences.json")
  .then(res => res.json())
  .then(data => {
    conferenceData = data;
    renderTable(data);
    initMap(data);
  });

</script>

</body>
</html>
