<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>核物理会议列表</h1>
  <a href="submit.html">👉 提交会议</a>
  
  <table id="conferenceTable">
    <tr>
      <th>会议名称</th>
      <th>地点</th>
      <th>时间</th>
      <th>官网</th>
    </tr>
  </table>

  <script>
    fetch("conferences.json")
      .then(response => response.json())
      .then(conferences => {
        const table = document.getElementById("conferenceTable");
        conferences.forEach(conf => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${conf.title}</td>
            <td>${conf.location}</td>
            <td>${conf.start_date} - ${conf.end_date}</td>
            <td><a href="${conf.link}" target="_blank">官网</a></td>
          `;
          table.appendChild(row);
        });
      })
      .catch(err => console.error("加载会议列表失败:", err));
  </script>
</body>
</html>
