<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    .sort-btn {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #2c7be5;
      font-weight: 600;
      transition: 0.2s;
    }

    .sort-btn:hover {
      color: #1a5fd0;
      transform: scale(1.15);
    }

    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .upcoming {
      background: #fff3cd;
      color: #856404;
    }

    .ongoing {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .past {
      background: #fbe9e7;
      color: #c62828;
    }
  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops Index
</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable"></table>

  <!-- 地图 -->
  <div id="map" style="width: 100%; height: 500px; margin-top: 40px;"></div>
</div>

<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>

<script>
  let conferenceData = [];

  // 城市坐标
  const geoCoordMap = {
    "北京": [116.4074, 39.9042],
    "上海": [121.4737, 31.2304],
    "南京": [118.7969, 32.0603],
    "广州": [113.2644, 23.1291],
    "西安": [108.9398, 34.3416],
    "武汉": [114.3055, 30.5928],
    "成都": [104.0665, 30.5728]
  };

  function getStatus(start, end) {
    const today = new Date();
    const startDate = new Date(start);
    const endDate = new Date(end);

    if (today < startDate) return '<span class="tag upcoming">即将开始</span>';
    else if (today <= endDate) return '<span class="tag ongoing">进行中</span>';
    else return '<span class="tag past">已结束</span>';
  }

  function renderTable(data) {
    const table = document.getElementById("conferenceTable");

    table.innerHTML = `
      <thead>
        <tr>
          <th>会议名称</th>
          <th>地点</th>
          <th>
            时间
            <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
            <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
          </th>
          <th>状态</th>
          <th>官网</th>
        </tr>
      </thead>
    `;

    data.forEach(conf => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td><strong>${conf.title}</strong></td>
        <td>${conf.location}</td>
        <td>${conf.start_date} — ${conf.end_date}</td>
        <td>${getStatus(conf.start_date, conf.end_date)}</td>
        <td><a href="${conf.link}" target="_blank">Visit</a></td>
      `;

      table.appendChild(row);
    });
  }

  function sortByDate(ascending) {
    conferenceData.sort((a, b) => {
      return ascending
        ? new Date(a.start_date) - new Date(b.start_date)
        : new Date(b.start_date) - new Date(a.start_date);
    });

    renderTable(conferenceData);
  }

  function getLatestConferences(data, n = 10) {
    return [...data]
      .sort((a, b) => new Date(b.start_date) - new Date(a.start_date))
      .slice(0, n);
  }

  function initMap(data) {
    const chart = echarts.init(document.getElementById("map"));
    const latest = getLatestConferences(data, 10);

    let points = [];
    let lines = [];

    latest.forEach(conf => {
      const coord = geoCoordMap[conf.location];
      if (!coord) return;

      points.push({
        name: conf.title,
        value: coord.concat(`${conf.location}\n${conf.start_date}`)
      });

      lines.push({
        coords: [
          [105, 35],  // 起点（中国中心）
          coord
        ]
      });
    });

    const option = {
      geo: {
        map: "china",
        roam: true,
        itemStyle: {
          areaColor: "#e6f0ff",
          borderColor: "#999"
        }
      },
      series: [
        {
          type: "scatter",
          coordinateSystem: "geo",
          data: points,
          symbolSize: 10,
          label: {
            show: true,
            formatter: p => p.name,
            position: "right"
          }
        },
        {
          type: "lines",
          coordinateSystem: "geo",
          effect: {
            show: true,
            symbol: "arrow",
            symbolSize: 6
          },
          lineStyle: {
            width: 2,
            curveness: 0.2
          },
          data: lines
        }
      ]
    };

    chart.setOption(option);
  }

  fetch("conferences.json")
    .then(res => res.json())
    .then(data => {
      conferenceData = data;
      renderTable(conferenceData);
      initMap(conferenceData);
    })
    .catch(err => console.error("加载失败:", err));
</script>

</body>
</html>
