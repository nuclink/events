<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>
  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
      font-size: 14px;
    }

    .submit-btn:hover {
      background: #2980b9;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
    }

    th {
      background-color: #3498db;
      color: white;
      font-weight: 500;
    }

    tr:nth-child(even) {
      background-color: #f9fbfd;
    }

    tr:hover {
      background-color: #eef6ff;
      transition: 0.2s;
    }

    td a {
      color: #3498db;
      text-decoration: none;
      font-weight: 500;
    }

    td a:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      table, th, td {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>核物理会议列表</h1>

    <div class="top-bar">
      <div></div>
      <a href="submit.html" class="submit-btn">+ 提交会议</a>
    </div>

    <table id="conferenceTable">
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>时间</th>
        <th>网页链接</th>
      </tr>
    </table>
  </div>

  <script>
    fetch("conferences.json")
      .then(response => response.json())
      .then(conferences => {
        const table = document.getElementById("conferenceTable");
        conferences.forEach(conf => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${conf.title}</td>
            <td>${conf.location}</td>
            <td>${conf.start_date} - ${conf.end_date}</td>
            <td><a href="${conf.link}" target="_blank">官网</a></td>
          `;
          table.appendChild(row);
        });
      })
      .catch(err => console.error("加载会议列表失败:", err));
  </script>
</body>
</html>
