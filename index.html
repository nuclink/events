<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    .sort-btn {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #2c7be5;
      font-weight: 600;
    }

    .sort-btn:hover {
      transform: scale(1.15);
    }

    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .upcoming { background: #fff3cd; color: #856404; }
    .ongoing { background: #e8f5e9; color: #2e7d32; }
    .past { background: #fbe9e7; color: #c62828; }
  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops Index
</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable"></table>

  <div id="map" style="width: 100%; height: 520px; margin-top: 40px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>

<script>
let conferenceData = [];

const geoCoordMap = {
  "北京": [116.4074, 39.9042],
  "上海": [121.4737, 31.2304],
  "南京": [118.7969, 32.0603],
  "广州": [113.2644, 23.1291],
  "西安": [108.9398, 34.3416],
  "武汉": [114.3055, 30.5928],
  "成都": [104.0665, 30.5728]
};

function getStatus(start, end) {
  const now = new Date();
  const s = new Date(start);
  const e = new Date(end);

  if (now < s) return '<span class="tag upcoming">即将开始</span>';
  if (now <= e) return '<span class="tag ongoing">进行中</span>';
  return '<span class="tag past">已结束</span>';
}

function renderTable(data) {
  const table = document.getElementById("conferenceTable");

  table.innerHTML = `
    <thead>
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>
          时间
          <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
          <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
        </th>
        <th>状态</th>
        <th>官网</th>
      </tr>
    </thead>
  `;

  data.forEach(c => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td><strong>${c.title}</strong></td>
      <td>${c.location}</td>
      <td>${c.start_date} — ${c.end_date}</td>
      <td>${getStatus(c.start_date, c.end_date)}</td>
      <td><a href="${c.link}" target="_blank">Visit</a></td>
    `;

    table.appendChild(row);
  });
}

function sortByDate(asc) {
  conferenceData.sort((a, b) => {
    return asc
      ? new Date(a.start_date) - new Date(b.start_date)
      : new Date(b.start_date) - new Date(a.start_date);
  });
  renderTable(conferenceData);
}

function getLatest(data, n = 10) {
  return [...data]
    .sort((a, b) => new Date(b.start_date) - new Date(a.start_date))
    .slice(0, n);
}

function initMap(data) {
  const chart = echarts.init(document.getElementById("map"));
  const latest = getLatest(data, 10);

  let lines = [];

  // 👉 先按纬度排序（关键！）
  latest.sort((a, b) => {
    const latA = geoCoordMap[a.location][1];
    const latB = geoCoordMap[b.location][1];
    return latB - latA;
  });

  // 👉 分组（避免标签挤在一起）
  const groups = [];
  let currentGroup = [];

  latest.forEach((c, i) => {
    currentGroup.push(c);

    if (currentGroup.length === 3 || i === latest.length - 1) {
      groups.push(currentGroup);
      currentGroup = [];
    }
  });

  let labels = [];
  let points = [];

  groups.forEach((group, gi) => {
    group.forEach((c, i) => {
      const coord = geoCoordMap[c.location];
      if (!coord) return;

      const [lon, lat] = coord;

      const centerLon = 105;
      const centerLat = 35;

      let dx = lon - centerLon;
      let dy = lat - centerLat;

      let len = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= len;
      dy /= len;

      const extend = 18;

      let outside = [
        lon + dx * extend,
        lat + dy * extend
      ];

      // 👉 同一组内部做轻微错开（防重叠关键）
      outside[1] += (i - 1) * 3;
      outside[0] += (gi % 2 === 0 ? 1 : -1) * 2;

      lines.push({
        coords: [coord, outside]
      });

      // 👉 标签数据
      labels.push({
        name: c.title,
        value: outside.concat(`${c.location}\n${c.start_date} — ${c.end_date}`)
      });

      points.push({
        name: c.title,
        value: coord
      });
    });
  });

  chart.setOption({
    geo: {
      map: "china",
      roam: true,
      itemStyle: {
        areaColor: "#e6f0ff",
        borderColor: "#999"
      }
    },

    series: [
      {
        type: "lines",
        coordinateSystem: "geo",
        effect: null,
        lineStyle: {
          width: 1.5,
          color: "#555"
        },
        data: lines
      },

      {
        type: "scatter",
        coordinateSystem: "geo",
        symbolSize: 6,
        itemStyle: {
          color: "#2c7be5"
        },
        data: points
      },

      {
        type: "scatter",
        coordinateSystem: "geo",
        symbol: "none",
        data: labels,

        label: {
          show: true,
          formatter: p => {
            const text = p.data.value[2].split("\n");
            return `{title|${p.data.name}}\n{time|${text[1]}}`;
          },

          rich: {
            title: {
              fontSize: 14,
              fontWeight: "bold",
              color: "#111"
            },
            time: {
              fontSize: 13,
              color: "#333"
            }
          },

          position: "right",
          align: "left",
          backgroundColor: "rgba(255,255,255,0.92)",
          padding: [6, 10],
          borderRadius: 5,
          distance: 8
        }
      }
    ]
  });
}

fetch("conferences.json")
  .then(res => res.json())
  .then(data => {
    conferenceData = data;
    renderTable(data);
    initMap(data);
  });
</script>

</body>
</html>
