<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
    }

    h1 {
      font-size: 38px;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
    }

    #map {
      width: 100%;
      height: 520px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<div class="header">Nuclear Physics Conferences & Workshops Index</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>

<script>
const geoCoordMap = {
  "北京": [116.4074, 39.9042],
  "上海": [121.4737, 31.2304],
  "南京": [118.7969, 32.0603],
  "广州": [113.2644, 23.1291],
  "西安": [108.9398, 34.3416],
  "武汉": [114.3055, 30.5928],
  "成都": [104.0665, 30.5728]
};

const colors = ["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6"];

const chart = echarts.init(document.getElementById("map"));

const data = [
  {title:"Conf A", location:"北京", start:"2026-04-01", end:"2026-04-05"},
  {title:"Conf B", location:"上海", start:"2026-04-10", end:"2026-04-15"},
  {title:"Conf C", location:"广州", start:"2026-05-01", end:"2026-05-05"},
  {title:"Conf D", location:"西安", start:"2026-06-01", end:"2026-06-05"},
  {title:"Conf E", location:"成都", start:"2026-07-01", end:"2026-07-05"}
];

let points = [];
let lines = [];

data.forEach((c, i) => {
  const coord = geoCoordMap[c.location];
  if (!coord) return;

  const angle = (i / data.length) * 2 * Math.PI;
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);

  const extend = 12;

  const outside = [
    coord[0] + dx * extend,
    coord[1] + dy * extend
  ];

  points.push({
    value: coord,
    location: c.location,
    name: c.title,
    time: c.start,
    labelPos: outside
  });

  lines.push({
    type: "lines",
    coordinateSystem: "geo",
    data: [{ coords: [coord, outside] }],
    lineStyle: {
      width: 2,
      color: colors[i % colors.length]
    }
  });
});

chart.setOption({
  geo: {
    map: "china",
    roam: false,
    itemStyle: {
      areaColor: "#e6f0ff",
      borderColor: "#999"
    }
  },
  series: [
    ...lines,
    {
      type: "scatter",
      coordinateSystem: "geo",
      symbolSize: 8,
      data: points,
      itemStyle: {
        color: (params) => colors[params.dataIndex % colors.length]
      }
    }
  ]
});

const zr = chart.getZr();

// ⭐ 正确做法：只加，不清空
function renderLabels() {
  points.forEach(p => {
    const pos = chart.convertToPixel({ geoIndex: 0 }, p.labelPos);

    const text = new echarts.graphic.Text({
      style: {
        x: pos[0],
        y: pos[1],

        text: `${p.location}\n${p.name}\n${p.time}`,

        font: "bold 14px Microsoft YaHei",
        fill: "#000",
        lineHeight: 18,

        textAlign: "center",
        textVerticalAlign: "middle"
      }
    });

    zr.add(text);
  });
}

// 等地图完全渲染后再画标签（非常重要）
setTimeout(renderLabels, 300);

// resize 保持同步
window.addEventListener("resize", () => {
  chart.resize();
  setTimeout(renderLabels, 100);
});
</script>

</body>
</html>
