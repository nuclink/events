<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: left;
      margin-bottom: 25px;
      color: #111111;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    /* 排序按钮 */
    .sort-btn {
      cursor: pointer;
      margin-left: 10px;      /* 和“时间”拉开距离 */
      font-size: 14px;        /* 稍微变大 */
      color: #2c7be5;
      font-weight: 600;       /* 更清晰一点 */
      transition: 0.2s;
    }

    .sort-btn:hover {
      color: #1a5fd0;
      transform: scale(1.15); /* 悬停放大一点点 */
    }

    /* 状态标签 */
    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .upcoming {
      background: #fff3cd;
      color: #856404;
    }

    .ongoing {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .past {
      background: #fbe9e7;
      color: #c62828;
    }

  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops Index
</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable">
    <thead>
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>
          时间
          <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
          <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
        </th>
        <th>状态</th>
        <th>官网</th>
      </tr>
    </thead>
  </table>
</div>

<script>
  let conferenceData = [];

  function getStatus(start, end) {
    const today = new Date();
    const startDate = new Date(start);
    const endDate = new Date(end);

    if (today < startDate) {
      return '<span class="tag upcoming">即将开始</span>';
    } else if (today <= endDate) {
      return '<span class="tag ongoing">进行中</span>';
    } else {
      return '<span class="tag past">已结束</span>';
    }
  }

  function renderTable(data) {
    const table = document.getElementById("conferenceTable");

    // 清除旧数据（保留表头）
    table.innerHTML = `
      <thead>
        <tr>
          <th>会议名称</th>
          <th>地点</th>
          <th>
            时间
            <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
            <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
          </th>
          <th>状态</th>
          <th>官网</th>
        </tr>
      </thead>
    `;

    data.forEach(conf => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td><strong>${conf.title}</strong></td>
        <td>${conf.location}</td>
        <td>${conf.start_date} — ${conf.end_date}</td>
        <td>${getStatus(conf.start_date, conf.end_date)}</td>
        <td><a href="${conf.link}" target="_blank">Visit</a></td>
      `;

      table.appendChild(row);
    });
  }

  function sortByDate(ascending) {
    conferenceData.sort((a, b) => {
      return ascending
        ? new Date(a.start_date) - new Date(b.start_date)
        : new Date(b.start_date) - new Date(a.start_date);
    });

    renderTable(conferenceData);
  }

  fetch("conferences.json")
    .then(response => response.json())
    .then(data => {
      conferenceData = data;
      renderTable(conferenceData);
    })
    .catch(err => console.error("加载失败:", err));
</script>

</body>
</html>
