<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
 }

    /* 表格整体布局固定，避免被内容撑开 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      table-layout: fixed; /* 固定布局，必须要有 */
    }

    /* 第一列：会议名称（稍宽） */
    th:nth-child(1),
    td:nth-child(1) {
      width: 40%;
      white-space: normal;
      word-break: break-word;
    }

    /* 第二列：地点（缩短） */
    th:nth-child(2),
    td:nth-child(2) {
      width: 14%;
    }

    /* 第三列：时间（加宽） */
    th:nth-child(3),
    td:nth-child(3) {
      width: 20%;
    }

    /* 第四列：状态（缩短） */
    th:nth-child(4),
    td:nth-child(4) {
      width: 8%;
    }

    /* 第五列：官网（缩短） */
    th:nth-child(5),
    td:nth-child(5) {
      width: 8%;
    }

    /* 其他列禁止换行 */
    th:nth-child(n+2),
    td:nth-child(n+2) {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    .sort-btn {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #2c7be5;
      font-weight: 600;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .upcoming { background: #fff3cd; color: #856404; }
    .ongoing { background: #e8f5e9; color: #2e7d32; }
    .past { background: #fbe9e7; color: #c62828; }

    /* ===== 日历样式（修改）===== */

    #calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-day {
      background: #f8fbff;
      height: 110px; /* 固定高度 */
      padding: 6px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
    }

    .calendar-date {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* 👉 自动换行 */
    .event {
      background: #2c7be5;
      color: white;
      border-radius: 4px;
      padding: 2px 4px;
      margin-top: 2px;
      font-size: 11px;

      white-space: normal;
      word-break: break-word;
    }
    .event.upcoming { background: #fff3cd; color: #856404; }
    .event.ongoing  { background: #e8f5e9; color: #2e7d32; }
    .event.past     { background: #fbe9e7; color: #c62828; }

  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops List
</div>

<div class="container">
  <h1 style="margin-top:40px; margin-bottom:40px;">核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable"></table>
  <h1 style="margin-top:140px; margin-bottom:80px;">核物理会议日程表</h1>
  <!-- ===== 日历（修改）===== -->
  <div id="calendar" style="margin-top:40px;">
    <div id="calendar-controls">
      <button onclick="changeMonth(-1)">◀</button>
      <div id="calendar-title" style="font-size:22px;font-weight:700;"></div>
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div id="calendar-grid"></div>
  </div>

</div>

<script>
let conferenceData = [];
let currentMonthOffset = 0;

function getStatus(start, end) {
  const now = new Date();
  const s = new Date(start);
  const e = new Date(end);

  if (now < s) return '<span class="tag upcoming">即将开始</span>';
  if (now <= e) return '<span class="tag ongoing">进行中</span>';
  return '<span class="tag past">已结束</span>';
}

function renderTable(data) {
  const table = document.getElementById("conferenceTable");

  table.innerHTML = `
    <thead>
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>
          时间
          <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
          <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
        </th>
        <th>状态</th>
        <th>官网</th>
      </tr>
    </thead>
  `;

  let prevYear = null;

  data.forEach((c, index) => {
    const row = document.createElement("tr");

    const currentYear = new Date(c.start_date).getFullYear();

    if (prevYear !== null && currentYear !== prevYear) {
      row.style.borderTop = "3px solid #2c3e50";
    }

    row.innerHTML = `
      <td><strong>${c.title}</strong></td>
      <td>${c.location}</td>
      <td>${c.start_date} — ${c.end_date}</td>
      <td>${getStatus(c.start_date, c.end_date)}</td>
      <td><a href="${c.link}" target="_blank">Visit</a></td>
    `;

    table.appendChild(row);
    prevYear = currentYear;
  });
}

function sortByDate(asc) {
  conferenceData.sort((a, b) => {
    return asc
      ? new Date(a.start_date) - new Date(b.start_date)
      : new Date(b.start_date) - new Date(a.start_date);
  });
  renderTable(conferenceData);
}

/* ===== 日历逻辑（修改）===== */

function changeMonth(offset) {
  currentMonthOffset += offset;
  renderCalendar(conferenceData);
}

function renderCalendar(data) {
  const titleEl = document.getElementById("calendar-title");
  const grid = document.getElementById("calendar-grid");

  grid.innerHTML = "";

  const now = new Date();
  const date = new Date(now.getFullYear(), now.getMonth() + currentMonthOffset, 1);

  const year = date.getFullYear();
  const month = date.getMonth();

  titleEl.innerText = `${year} 年 ${month + 1} 月`;

  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const eventMap = {};

  data.forEach(c => {
    let start = new Date(c.start_date);
    let end = new Date(c.end_date);

    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key =
        d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
      if (!eventMap[key]) eventMap[key] = [];
      const now = new Date();
      const s = new Date(c.start_date);
      const e = new Date(c.end_date);

      let status = "";
      if (now < s) status = "upcoming";
      else if (now <= e) status = "ongoing";
      else status = "past";
      eventMap[key].push({
        title: c.title,
        location: c.location,
        status: status
      });
    }
  });

  for (let i = 0; i < startDay; i++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day";
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day";

    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    cell.innerHTML = `<div class="calendar-date">${d}</div>`;

    if (eventMap[dateStr]) {
      eventMap[dateStr].forEach(eData => {
        const e = document.createElement("div");
        e.className = `event ${eData.status}`;

        // 👉 名称 + 地点
        e.innerText = `${eData.title} (${eData.location})`;

        cell.appendChild(e);
      });
    }

    grid.appendChild(cell);
  }
}

fetch("conferences.json")
  .then(res => res.json())
  .then(data => {
    conferenceData = data;

    sortByDate(false);
    renderCalendar(data);
  });
</script>

</body>
</html>
