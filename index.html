<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    .sort-btn {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #2c7be5;
      font-weight: 600;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .upcoming { background: #fff3cd; color: #856404; }
    .ongoing { background: #e8f5e9; color: #2e7d32; }
    .past { background: #fbe9e7; color: #c62828; }
    .calendar {
  margin-top: 10px;
}

.calendar-header {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 15px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar-day {
  background: #f8fbff;
  min-height: 90px;
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
}

.calendar-day.other-month {
  background: #f0f2f5;
  color: #aaa;
}

.calendar-date {
  font-weight: 700;
  margin-bottom: 4px;
}

.event {
  background: #2c7be5;
  color: white;
  border-radius: 4px;
  padding: 2px 4px;
  margin-top: 2px;
  font-size: 11px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops List
</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable"></table>
  <div id="calendar" style="margin-top:40px;"></div>
</div>

<script>
let conferenceData = [];

function getStatus(start, end) {
  const now = new Date();
  const s = new Date(start);
  const e = new Date(end);

  if (now < s) return '<span class="tag upcoming">即将开始</span>';
  if (now <= e) return '<span class="tag ongoing">进行中</span>';
  return '<span class="tag past">已结束</span>';
}

function renderTable(data) {
  const table = document.getElementById("conferenceTable");

  table.innerHTML = `
    <thead>
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>
          时间
          <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
          <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
        </th>
        <th>状态</th>
        <th>官网</th>
      </tr>
    </thead>
  `;

let prevYear = null;

data.forEach((c, index) => {
  const row = document.createElement("tr");

  const currentYear = new Date(c.start_date).getFullYear();

  // 👉 如果年份变化，加粗分割线
  if (prevYear !== null && currentYear !== prevYear) {
    row.style.borderTop = "3px solid #2c3e50";
  }

  row.innerHTML = `
    <td><strong>${c.title}</strong></td>
    <td>${c.location}</td>
    <td>${c.start_date} — ${c.end_date}</td>
    <td>${getStatus(c.start_date, c.end_date)}</td>
    <td><a href="${c.link}" target="_blank">Visit</a></td>
  `;

  table.appendChild(row);

  prevYear = currentYear;
});
}

function sortByDate(asc) {
  conferenceData.sort((a, b) => {
    return asc
      ? new Date(a.start_date) - new Date(b.start_date)
      : new Date(b.start_date) - new Date(a.start_date);
  });
  renderTable(conferenceData);
}
function renderCalendar(data) {
  const container = document.getElementById("calendar");
  container.innerHTML = "";

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();

  // 标题
  const header = document.createElement("div");
  header.className = "calendar-header";
  header.innerText = `${year} 年 ${month + 1} 月`;
  container.appendChild(header);

  const grid = document.createElement("div");
  grid.className = "calendar-grid";

  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // 👉 过滤会议（未开始 + 进行中）
  const validEvents = data.filter(c => {
    const end = new Date(c.end_date);
    return now <= end;
  });

  // 👉 日期映射
  const eventMap = {};

  validEvents.forEach(c => {
    let start = new Date(c.start_date);
    let end = new Date(c.end_date);

    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = d.toISOString().split("T")[0];
      if (!eventMap[key]) eventMap[key] = [];
      eventMap[key].push(c.title);
    }
  });

  // 空白占位
  for (let i = 0; i < startDay; i++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day other-month";
    grid.appendChild(cell);
  }

  // 本月
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day";

    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    cell.innerHTML = `<div class="calendar-date">${d}</div>`;

    if (eventMap[dateStr]) {
      eventMap[dateStr].forEach(title => {
        const e = document.createElement("div");
        e.className = "event";
        e.innerText = title;
        cell.appendChild(e);
      });
    }

    grid.appendChild(cell);
  }

  container.appendChild(grid);
}

fetch("conferences.json")
  .then(res => res.json())
  .then(data => {
    conferenceData = data;

    // 👇 默认按时间倒序（最新在前）
    sortByDate(false);
    // 👇 新增
    renderCalendar(data);
  });
</script>

</body>
</html>
