<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 38px;
      font-weight: 800;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #e5eaf0;
    }

    tr:hover {
      background: #f8fbff;
    }

    .sort-btn {
      cursor: pointer;
      margin-left: 10px;
      font-size: 14px;
      color: #2c7be5;
      font-weight: 600;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .upcoming { background: #fff3cd; color: #856404; }
    .ongoing { background: #e8f5e9; color: #2e7d32; }
    .past { background: #fbe9e7; color: #c62828; }
  </style>
</head>

<body>

<div class="header">
  Nuclear Physics Conferences & Workshops Index
</div>

<div class="container">
  <h1>核物理会议列表</h1>

  <div class="top-bar">
    <div></div>
    <a href="submit.html" class="submit-btn">+ 提交会议</a>
  </div>

  <table id="conferenceTable"></table>

  <div id="map" style="width: 100%; height: 520px; margin-top: 40px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>

<script>
let conferenceData = [];

const geoCoordMap = {
  "北京": [116.4074, 39.9042],
  "上海": [121.4737, 31.2304],
  "南京": [118.7969, 32.0603],
  "广州": [113.2644, 23.1291],
  "西安": [108.9398, 34.3416],
  "武汉": [114.3055, 30.5928],
  "成都": [104.0665, 30.5728]
};

function getStatus(start, end) {
  const now = new Date();
  const s = new Date(start);
  const e = new Date(end);

  if (now < s) return '<span class="tag upcoming">即将开始</span>';
  if (now <= e) return '<span class="tag ongoing">进行中</span>';
  return '<span class="tag past">已结束</span>';
}

function renderTable(data) {
  const table = document.getElementById("conferenceTable");

  table.innerHTML = `
    <thead>
      <tr>
        <th>会议名称</th>
        <th>地点</th>
        <th>
          时间
          <span class="sort-btn" onclick="sortByDate(true)">🔼</span>
          <span class="sort-btn" onclick="sortByDate(false)">🔽</span>
        </th>
        <th>状态</th>
        <th>官网</th>
      </tr>
    </thead>
  `;

  data.forEach(c => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td><strong>${c.title}</strong></td>
      <td>${c.location}</td>
      <td>${c.start_date} — ${c.end_date}</td>
      <td>${getStatus(c.start_date, c.end_date)}</td>
      <td><a href="${c.link}" target="_blank">Visit</a></td>
    `;

    table.appendChild(row);
  });
}

function sortByDate(asc) {
  conferenceData.sort((a, b) => {
    return asc
      ? new Date(a.start_date) - new Date(b.start_date)
      : new Date(b.start_date) - new Date(a.start_date);
  });
  renderTable(conferenceData);
}

function getLatest(data, n = 10) {
  return [...data]
    .sort((a, b) => new Date(b.start_date) - new Date(a.start_date))
    .slice(0, n);
}

function initMap(data) {
  const chart = echarts.init(document.getElementById("map"));

  const now = new Date();

  // ===== 1. 过滤：只保留“即将开始 + 进行中” =====
  let filtered = data.filter(c => {
    const s = new Date(c.start_date);
    const e = new Date(c.end_date);
    return now <= e; // 即将开始 + 进行中
  });

  // ===== 2. 取前5个（按开始时间排序）=====
  filtered.sort((a, b) => new Date(a.start_date) - new Date(b.start_date));
  const latest = filtered.slice(0, 5);

  let points = [];
  let lineSeries = [];

  const colors = [
    "#e74c3c", "#3498db", "#2ecc71", "#f39c12",
    "#9b59b6", "#1abc9c", "#e67e22", "#2c3e50"
  ];
  // ===== 每条线的固定角度（单位：弧度）=====
  const customAngles = [
    0,                  // 第1条（向右）
    Math.PI / 3,        // 第2条（60°）
    2 * Math.PI / 3,    // 第3条（120°）
    Math.PI,            // 第4条（180°）
    5 * Math.PI / 3     // 第5条（300°）
  ];

  // ===== 3. 中心点（用于极角分布）=====
  const center = [104.0, 35.0];

  // ===== 4. 计算角度（用于均匀分布）=====
  latest.forEach(c => {
    const coord = geoCoordMap[c.location];
    if (!coord) return;

    c._angle = Math.atan2(
      coord[1] - center[1],
      coord[0] - center[0]
    );
  });

  latest.sort((a, b) => a._angle - b._angle);

  const N = latest.length;

  latest.forEach((c, i) => {
    const coord = geoCoordMap[c.location];
    if (!coord) return;

    const [lon, lat] = coord;

    // ===== 关键：均匀角度分布 =====
    const angle = customAngles[i] || (i / N) * 2 * Math.PI;
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);

    const extend = 15;

    const outside = [
      lon + dx * extend,
      lat + dy * extend
    ];

    points.push({
      name: c.title,
      value: coord,
      location: c.location,
      time: `${c.start_date} — ${c.end_date}`,
      labelPos: outside
    });

    const color = colors[i % colors.length];

    lineSeries.push({
      type: "lines",
      coordinateSystem: "geo",
      data: [{ coords: [coord, outside] }],
      lineStyle: {
        width: 2,
        color: color
      }
    });
  });

  chart.setOption({
    title: {
      text: "即将召开的5个核物理会议",
      left: "center",
      top: "5",
      textStyle: {
        fontFamily: "Microsoft YaHei, sans-serif",
        fontSize: 38,
        fontWeight: 800,
        color: "#1f2d3d"
      }
    },
    geo: {
      map: "china",
      roam: false,
      itemStyle: {
        areaColor: "#e6f0ff",
        borderColor: "#999"
      }
    },
    series: [
      ...lineSeries,
      {
        type: "scatter",
        coordinateSystem: "geo",
        symbolSize: 8,
        data: points,
        itemStyle: {
          color: (params) => colors[params.dataIndex % colors.length]
        }
      }
    ]
  });

  const zr = chart.getZr();

function renderLabels() {
  zr.storage._displayList = [];

  points.forEach((p) => {
    const pos = chart.convertToPixel({ geoIndex: 0 }, p.labelPos);

    const text = new echarts.graphic.Text({
      style: {
        x: pos[0],
        y: pos[1],
        text: `${p.location}\n${p.name}\n${p.time.split("—")[0].trim()}`,
        font: "bold 15px Microsoft YaHei",
        fill: "#111",
        lineHeight: 20,

        // 👉 关键：让“文字中心”对齐线的终点
        textAlign: "middle",
        textVerticalAlign: "middle"
      }
    });

    zr.add(text);
  });
}
  
  setTimeout(renderLabels, 200);
}

fetch("conferences.json")
  .then(res => res.json())
  .then(data => {
    conferenceData = data;
    renderTable(data);
    initMap(data);
  });
</script>

</body>
</html>
