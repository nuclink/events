<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>核物理会议信息</title>

  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    /* 顶部栏（类似APS） */
    .header {
      background: #1f2d3d;
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .sub-header {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 5px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: left;
      margin-bottom: 25px;
      color: #0f2233;
      font-size: 38px;      /* 更大 */
      font-weight: 800;     /* 更粗 */
      letter-spacing: 1px;
      border-left: 6px solid #2c7be5;
      padding-left: 14px;
      line-height: 1.2;
    }

    /* 工具栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .submit-btn {
      text-decoration: none;
      background: #3498db;
      color: white;
      padding: 8px 18px;
      border-radius: 5px;
      font-size: 14px;
      transition: 0.25s;
    }

    .submit-btn:hover {
      background: #217dbb;
    }

    /* 表格（数据库风格） */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead {
      background: #f0f4f8;
      border-bottom: 2px solid #d6dde6;
    }

    th {
      padding: 12px;
      text-align: left;
      color: #2c3e50;
      font-weight: 600;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5eaf0;
      color: #34495e;
    }

    tr:hover {
      background: #f8fbff;
    }

    td a {
      color: #2c7be5;
      text-decoration: none;
      font-weight: 500;
    }

    td a:hover {
      text-decoration: underline;
    }

    /* 状态标签（时间增强） */
    .tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .upcoming {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .past {
      background: #fbe9e7;
      color: #c62828;
    }

    /* 页脚 */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    Nuclear Physics Conferences & Workshops Index
  </div>

  <div class="container">
    <h1>核物理会议列表</h1>

    <div class="top-bar">
      <div></div>
      <a href="submit.html" class="submit-btn">+ 提交会议</a>
    </div>

    <table id="conferenceTable">
      <thead>
        <tr>
          <th>会议名称</th>
          <th>地点</th>
          <th>时间</th>
          <th>状态</th>
          <th>官网</th>
        </tr>
      </thead>
    </table>

  <script>
    fetch("conferences.json")
      .then(response => response.json())
      .then(conferences => {
        const table = document.getElementById("conferenceTable");

        const today = new Date();

        conferences.forEach(conf => {
          const row = document.createElement("tr");

          const endDate = new Date(conf.end_date);

          let status = "";
          if (endDate >= today) {
            status = '<span class="tag upcoming">进行中 / 即将</span>';
          } else {
            status = '<span class="tag past">已结束</span>';
          }

          row.innerHTML = `
            <td><strong>${conf.title}</strong></td>
            <td>${conf.location}</td>
            <td>${conf.start_date} — ${conf.end_date}</td>
            <td>${status}</td>
            <td><a href="${conf.link}" target="_blank">Visit</a></td>
          `;

          table.appendChild(row);
        });
      })
      .catch(err => console.error("加载会议列表失败:", err));
  </script>

</body>
</html>
