<form id="conferenceForm">
  会议名称:<br>
  <input type="text" name="title" required style="width:100%;"><br><br>

  地点:<br>
  <input type="text" name="location" required style="width:100%;"><br><br>

  开始日期:<br>
  <input type="date" name="start_date" required><br><br>

  结束日期:<br>
  <input type="date" name="end_date" required><br><br>

  官方网站:<br>
  <input type="url" name="link" required style="width:100%;"><br><br>

  备注（可选）:<br>
  <textarea name="note" style="width:100%; height:100px;"></textarea><br><br>

  <button type="submit" style="padding:10px 20px;">提交会议</button>
</form>

<script>
document.getElementById("conferenceForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const data = {
    title: this.title.value,
    location: this.location.value,
    start_date: this.start_date.value,
    end_date: this.end_date.value,
    link: this.link.value,
    note: this.note.value
  };

  // 把数据转换成 YAML
  const yamlData = `
- title: ${data.title}
  location: ${data.location}
  start_date: ${data.start_date}
  end_date: ${data.end_date}
  link: ${data.link}
  note: ${data.note || ""}
`;

  // 安全触发 GitHub Actions workflow
  try {
    const response = await fetch("/.netlify/functions/submitConference", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ CONFERENCE_YAML: yamlData })
    });

    if (response.ok) {
      document.getElementById("message").innerText = "数据已提交，等待审核上线！";
      this.reset();
    } else {
      document.getElementById("message").innerText = "提交失败，请联系管理员";
      console.error(await response.text());
    }
  } catch(err) {
    document.getElementById("message").innerText = "提交失败，请检查网络";
    console.error(err);
  }
});
</script>
